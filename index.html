    ========================================================= */

    }

       BODY
    ========================================================= */

    html {

    }

      font-family:

        radial-gradient(

       APP
    ========================================================= */

      width: min(760px, 100%);

       HEADER

      justify-content: space-between;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #3b82f6
        );

      box-shadow:
        0 8px 20px rgba(37,99,235,0.22);

      font-size: 21px;
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .brand-text p {
      margin-top: 3px;

      font-weight: 500;

    .status {
      display: flex;
      align-items: center;
      gap: 7px;

      background: rgba(255,255,255,0.8);

      border: 1px solid var(--border);

      border-radius: 999px;

      color: var(--text-soft);

      font-size: 11px;
      font-weight: 600;

      box-shadow: var(--shadow-sm);
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #22c55e;

      box-shadow:
        0 0 0 4px rgba(34,197,94,0.10);
    }


    /* =========================================================
       CARD
    ========================================================= */

    .card {
      position: relative;

      margin-bottom: 18px;

      padding: 24px;

      border: 1px solid rgba(226,232,240,0.9);

      justify-content: space-between;

    }

      display: flex;
      align-items: center;

      font-weight: 750;

    .section-icon {

      font-size: 16px;

       TIME INPUT
    ========================================================= */

    }

    .time-input {

  </style>

  <script>

    /* =========================================================
       ELEMENT
    ========================================================= */

    const $ = id =>
      document.getElementById(id);


    const fields = [
      "startHour",
      "startMinute",
      "stopHour",
      "stopMinute"
    ];


    /* =========================================================
       VALUE
    ========================================================= */

    function val(id) {

      const n =
        Number($(id).value);

      return Number.isFinite(n)
        ? n
        : 0;

    }


    /* =========================================================
       CALCULATE
    ========================================================= */

    function calculate(
      saveHistory = true
    ) {

      const sh =
        val("startHour");

      const sm =
        val("startMinute");

      const eh =
        val("stopHour");

      const em =
        val("stopMinute");


      /* VALIDATION */

      if (
        [sh, sm, eh, em].some(
          n => n < 0
        ) ||
        sh > 23 ||
        eh > 23 ||
        sm > 59 ||
        em > 59
      ) {

        alert(
          "Masukkan waktu yang valid.\n\n" +
          "Jam: 00–23\n" +
          "Menit: 00–59"
        );

        return;

      }


      /* CONVERT TO MINUTES */

      const start =
        sh * 60 + sm;

      let stop =
        eh * 60 + em;


      let diff =
        stop - start;


      /*
        Jika waktu STOP lebih kecil
        dari START, dianggap melewati
        tengah malam.
      */

      if (diff < 0) {

        diff += 24 * 60;

      }


      /* RESULT */

      const h =
        Math.floor(diff / 60);

      const m =
        diff % 60;


      $("result").textContent =
        diff;

      $("hours").textContent =
        h;

      $("mins").textContent =
        m;

      $("clock").textContent =
        `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;


      /* SAVE */

      if (saveHistory) {

        addHistory({
          sh,
          sm,
          eh,
          em,
          diff,
          h,
          m
        });

      }

    }


    /* =========================================================
       HISTORY
    ========================================================= */

    function addHistory(item) {

      let history =
        JSON.parse(
          localStorage.getItem(
            "timeCalculatorHistory"
          ) || "[]"
        );


      history.unshift({
        ...item,
        id: Date.now()
      });


      /*
        Simpan maksimal
        10 histori terbaru.
      */

      history =
        history.slice(0, 10);


      localStorage.setItem(
        "timeCalculatorHistory",
        JSON.stringify(history)
      );


      renderHistory();

    }


    /* =========================================================
       RENDER HISTORY
    ========================================================= */

    function renderHistory() {

      const box =
        $("history");


      const history =
        JSON.parse(
          localStorage.getItem(
            "timeCalculatorHistory"
          ) || "[]"
        );


      $("historyCount").textContent =
        `${history.length} data`;


      if (!history.length) {

        box.innerHTML = `
          <div class="history-empty">
            Belum ada perhitungan.
          </div>
        `;

        return;

      }


      box.innerHTML =
        history.map(x => `

          <div class="history-item">

            <div>

              <div class="history-time">

                ${fmt(x.sh)}:${fmt(x.sm)}

                <span style="color:#94a3b8;">
                  →
                </span>

                ${fmt(x.eh)}:${fmt(x.em)}

              </div>

              <div class="history-result">

                ${x.diff} menit

              </div>

            </div>


            <button
              class="delete"
              onclick="removeHistory(${x.id})"
              aria-label="Hapus riwayat"
              title="Hapus"
            >
              ✕
            </button>

          </div>

        `).join("");

    }


    /* =========================================================
       FORMAT
    ========================================================= */

    function fmt(n) {

      return String(n)
        .padStart(2, "0");

    }


    /* =========================================================
       DELETE HISTORY
    ========================================================= */

    function removeHistory(id) {

      let history =
        JSON.parse(
          localStorage.getItem(
            "timeCalculatorHistory"
          ) || "[]"
        );


      history =
        history.filter(
          x => x.id !== id
        );


      localStorage.setItem(
        "timeCalculatorHistory",
        JSON.stringify(history)
      );


      renderHistory();

    }


    /* =========================================================
       RESET
    ========================================================= */

    function resetAll() {

      fields.forEach(
        id => $(id).value = ""
      );


      $("result").textContent =
        "0";

      $("hours").textContent =
        "0";

      $("mins").textContent =
        "0";

      $("clock").textContent =
        "00:00";


      $("startHour").focus();

    }


    /* =========================================================
       EVENTS
    ========================================================= */

    $("calculate")
      .addEventListener(
        "click",
        () => calculate(true)
      );


    $("reset")
      .addEventListener(
        "click",
        resetAll
      );


    fields.forEach(
      (id, i) => {

        $(id).addEventListener(
          "keydown",
          e => {

            if (e.key === "Enter") {

              calculate(true);

            }


            if (
              e.key === "ArrowRight" &&
              i < fields.length - 1
            ) {

              $(fields[i + 1]).focus();

            }


            if (
              e.key === "ArrowLeft" &&
              i > 0
            ) {

              $(fields[i - 1]).focus();

            }

          }
        );

      }
    );


    /* =========================================================
       AUTO SELECT / FORMAT
    ========================================================= */

    fields.forEach(id => {

      $(id).addEventListener(
        "focus",
        function() {

          this.select();

        }
      );

    });


    /* =========================================================
       INITIAL HISTORY
    ========================================================= */

    renderHistory();


    /* =========================================================
       PWA SERVICE WORKER
    ========================================================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")
            .catch(
              err =>
                console.log(
                  "Service Worker:",
                  err
                )
            );

        }
      );

    }

  </script>

</body>
</html>
